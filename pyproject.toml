[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "refshift"
version = "0.16.3"
description = "Reference-shift experiments for motor-imagery EEG decoding."
requires-python = ">=3.10"
dependencies = [
    # MOABB pinned for reproducibility of the 65.99% IV-2a CSP+LDA calibration
    # (verified at this version; loosen only after re-verifying the target).
    "moabb==1.5.0",
    "mne>=1.5",
    "pyriemann>=0.5",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.60",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# Phase 2 DL dependencies. Install with `pip install -e '.[dl]'`.
# braindecode 1.12 renamed EEGNetv4 -> EEGNet (with v4 alias); 1.14 removes
# the alias. refshift.model handles both via try/except, so >=1.0 is fine.
dl = [
    "braindecode>=1.0",
    "torch>=2.0",
    "skorch>=0.15",
]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["refshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
